    opacity: 1;
    padding-top: 14px;
    padding-bottom: 8px;
    border-top-color: var(--border-color);

    color: var(--text-secondary);

    gap: 16px;
    align-items: center;

  .filter-label {

    color: var(--text-muted);

    margin-right: 2px;

    background: var(--accent-blue);
    color: #0f172a;
    font-weight: 600;
    border-color: var(--accent-blue);
  }

  .timeline-container {
    max-width: 1050px;
    margin: 36px auto 0;
    padding: 0 20px;
    position: relative;
  }

  /* Central vertical line */
  .timeline-container::before {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 3px;
    background: linear-gradient(180deg, var(--accent-blue) 0%, var(--timeline-line) 15%, var(--timeline-line) 85%, var(--border-color) 100%);
    transform: translateX(-50%);
    z-index: 1;
  }

  @media (max-width: 820px) {
    .timeline-container::before {
      left: 28px;
    }
  }

  /* Timeline Item */
  .timeline-item {
    position: relative;
    margin-bottom: 38px;
    width: 50%;
    z-index: 2;
  }

  .timeline-item:nth-child(odd) {
    left: 0;
    padding-right: 32px;
  }

  .timeline-item:nth-child(even) {
    left: 50%;
    padding-left: 32px;
  }

  @media (max-width: 820px) {
    .timeline-item {
      width: 100% !important;
      left: 0 !important;
      padding-left: 60px !important;
      padding-right: 0 !important;
    }
  }

  /* Timeline Marker Dot */
  .timeline-dot {
    position: absolute;
    top: 18px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--bg-card);
    border: 3px solid var(--accent-blue);
    z-index: 3;
    transition: all 0.25s ease;
    box-shadow: 0 0 0 4px var(--bg-primary);
  }

  .timeline-item:nth-child(odd) .timeline-dot {
    right: -8px;
  }

  .timeline-item:nth-child(even) .timeline-dot {
    left: -8px;
  }

  @media (max-width: 820px) {
    .timeline-item .timeline-dot {
      left: 20px !important;
      right: auto !important;
    }
  }

  .cat-handover .timeline-dot { border-color: var(--accent-purple); box-shadow: 0 0 8px rgba(192, 132, 252, 0.4); }

  .tag-cat-chemical { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); border: 1px solid rgba(56, 189, 248, 0.3); }
  .tag-cat-overhaul { background: rgba(52, 211, 153, 0.15); color: var(--accent-green); border: 1px solid rgba(52, 211, 153, 0.3); }

  .card-details {

  .detail-title {

  footer {

let activeVendor = 'all';
let activeCat = 'all';
let isAllExpanded = false;
let isDrawerOpen = false;

function toggleDrawer() {
  isDrawerOpen = !isDrawerOpen;
  const drawer = document.getElementById('filterDrawer');
  const icon = document.getElementById('drawerIcon');
  const btn = document.getElementById('toggleDrawerBtn');
  const text = document.getElementById('drawerBtnText');

  if (isDrawerOpen) {
    drawer.classList.add('open');
    icon.innerText = '🔼';
    btn.classList.add('active');
    text.innerText = '收合篩選';
  } else {
    drawer.classList.remove('open');
    icon.innerText = '🔽';
    btn.classList.remove('active');
    text.innerText = '篩選條件';
  }
}

function renderTimeline(data) {
  const container = document.getElementById('timelineContainer');
  container.innerHTML = '';

  if (data.length === 0) {
    document.getElementById('emptyState').style.display = 'block';
    document.getElementById('eventCountDisplay').innerText = '0 筆';
    return;
  }
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('eventCountDisplay').innerText = `${data.length} / ${eventData.length} 筆`;

  data.forEach((evt) => {
    const item = document.createElement('div');
    item.className = `timeline-item cat-${evt.category_tag}`;
    item.id = evt.id;

    // Docs HTML generator
    let docsHtml = '';
    if (evt.docs && evt.docs.length > 0) {
      docsHtml = evt.docs.map(d => {
        const icon = d.type === 'pdf' ? '📕' : '📘';
        // Safe escaping for onclick
        const escapedUnc = d.unc_path.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        return `
          <div class="doc-item-row">
            <a href="${d.file_uri}" target="_blank" class="doc-link" title="點擊在瀏覽器直接開啟：\n${d.unc_path}">
              <span class="doc-type-icon">${icon}</span>
              <span>${d.name}</span>
            </a>
            <div class="doc-btn-group">
              <a href="${d.file_uri}" target="_blank" class="btn-doc-action btn-doc-open" title="在新分頁開啟檔案">開啟</a>
              <button class="btn-doc-action" onclick="copyFilePath('${escapedUnc}', this)" title="複製 UNC 網路路徑，可在檔案總管貼上">複製路徑</button>
            </div>
          </div>
        `;
      }).join('');
    } else {
      docsHtml = `<div class="source-text">${evt.source || '無附加檔案'}</div>`;
    }

    item.innerHTML = `
      <div class="timeline-dot"></div>
      <div class="timeline-card ${isAllExpanded ? 'active' : ''}" onclick="cardClicked(event, this)">
        <div class="card-top">
          <div class="date-badge">
            📅 ${evt.date}
            <span class="roc_date">(${evt.roc_year})</span>
          </div>
          <div class="tag-group">
            <span class="tag tag-vendor-${evt.vendor}">${evt.vendor}</span>
            <span class="tag tag-cat-${evt.category_tag}">${evt.category}</span>
          </div>
        </div>
        <div class="system-label">⚙️ ${evt.system}</div>
        <div class="problem-headline">
          ⚠️ ${evt.problem}
        </div>
        <div class="hover-hint">
          <span>🔍 滑鼠移入檢視改善對策與成效</span>
        </div>
        <div class="card-details">
          <div class="detail-block">
            <div class="detail-title title-suggestion">🛠️ 廠商建議對策</div>
            <div class="detail-text">${evt.suggestion}</div>
          </div>
          <div class="detail-block">
            <div class="detail-title title-outcome">✅ 後續改善成效</div>
            <div class="detail-text">${evt.outcome}</div>
          </div>
          <div class="detail-block">
            <div class="detail-title title-source">📄 關聯來源文件</div>
            <div class="docs-list">
              ${docsHtml}
            </div>
          </div>
        </div>
      </div>
    `;
    container.appendChild(item);
  });
}

function cardClicked(event, card) {
  // If clicked on an interactive link/button, do not toggle
  if (event.target.closest('a') || event.target.closest('button')) {
    return;
  }
  card.classList.toggle('active');
}

function copyFilePath(path, btn) {
  navigator.clipboard.writeText(path).then(() => {
    showToast(`已複製路徑：${path.split('\\\\').pop()}`);
    const originalText = btn.innerText;
    btn.innerText = '✓ 已複製';
    btn.style.color = 'var(--accent-green)';
    setTimeout(() => {
      btn.innerText = originalText;
      btn.style.color = '';
    }, 1800);
  }).catch(err => {
    showToast('複製失敗，請手動複製路徑');
  });
}

function showToast(msg) {
  const toast = document.getElementById('toastNotice');
  toast.innerText = msg;
  toast.style.display = 'block';
  setTimeout(() => {
    toast.style.display = 'none';
  }, 3000);
}

function setFilter(type, val, element) {
  const parent = element.parentElement;
  parent.querySelectorAll('.filter-chip').forEach(el => el.classList.remove('active'));
  element.classList.add('active');

  if (type === 'vendor') activeVendor = val;
  if (type === 'cat') activeCat = val;

  filterEvents();
}

function resetFilters() {
  activeVendor = 'all';
  activeCat = 'all';
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.filter-chip').forEach(el => {
    if (el.getAttribute('data-val') === 'all') {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
  filterEvents();
}

function filterEvents() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  const filtered = eventData.filter(evt => {
    const matchVendor = (activeVendor === 'all') || (evt.vendor === activeVendor);
    const matchCat = (activeCat === 'all') || (evt.category_tag === activeCat);
    const matchQuery = !query || 
      evt.date.toLowerCase().includes(query) ||
      evt.roc_year.toLowerCase().includes(query) ||
      evt.problem.toLowerCase().includes(query) ||
      evt.suggestion.toLowerCase().includes(query) ||
      evt.outcome.toLowerCase().includes(query) ||
      evt.system.toLowerCase().includes(query) ||
      (evt.docs && evt.docs.some(d => d.name.toLowerCase().includes(query)));

    return matchVendor && matchCat && matchQuery;
  });

  renderTimeline(filtered);
}

function toggleAllCards() {
  isAllExpanded = !isAllExpanded;
  const btn = document.getElementById('toggleAllBtn');
  btn.innerText = isAllExpanded ? '📖 收合細節' : '📖 展開細節';
  if (isAllExpanded) {
    btn.classList.add('active');
  } else {
    btn.classList.remove('active');
  }
  document.querySelectorAll('.timeline-card').forEach(c => {
    if (isAllExpanded) c.classList.add('active');
    else c.classList.remove('active');
  });
}

// Initial render
renderTimeline(eventData);
</script>
</body>
</html>
